name: Actions storage full inventory

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/actions-storage-inventory.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Inventory all historical artifacts and caches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/artifacts-all.tsv
          : > /tmp/caches-all.tsv

          page=1
          while :; do
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/actions/artifacts?per_page=100&page=$page" \
              -o /tmp/artifacts.json
            python3 - /tmp/artifacts.json >> /tmp/artifacts-all.tsv <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          for a in d.get("artifacts",[]):
              wr=a.get("workflow_run") or {}
              print("\t".join([
                  str(a.get("id","")),
                  a.get("created_at",""),
                  a.get("updated_at",""),
                  str(a.get("size_in_bytes",0)),
                  "expired" if a.get("expired") else "active",
                  a.get("name","").replace("\t"," "),
                  str(wr.get("id",""))
              ]))
          PY
            n="$(python3 -c 'import json; print(len(json.load(open("/tmp/artifacts.json")).get("artifacts",[])))')"
            [ "$n" -lt 100 ] && break
            page=$((page+1))
          done

          page=1
          while :; do
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/actions/caches?per_page=100&page=$page" \
              -o /tmp/caches.json
            python3 - /tmp/caches.json >> /tmp/caches-all.tsv <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          for c in d.get("actions_caches",[]):
              print("\t".join([
                  str(c.get("id","")),
                  c.get("created_at",""),
                  c.get("last_accessed_at",""),
                  str(c.get("size_in_bytes",0)),
                  c.get("key","").replace("\t"," "),
                  c.get("ref","")
              ]))
          PY
            n="$(python3 -c 'import json; print(len(json.load(open("/tmp/caches.json")).get("actions_caches",[])))')"
            [ "$n" -lt 100 ] && break
            page=$((page+1))
          done

          python3 - <<'PY'
          from pathlib import Path
          def rows(path):
              p=Path(path)
              if not p.exists(): return []
              out=[]
              for line in p.read_text().splitlines():
                  if line.strip(): out.append(line.split("\t"))
              return out
          arts=rows("/tmp/artifacts-all.tsv")
          caches=rows("/tmp/caches-all.tsv")
          arts.sort(key=lambda r:r[1])
          caches.sort(key=lambda r:r[1])
          art_bytes=sum(int(r[3]) for r in arts)
          cache_bytes=sum(int(r[3]) for r in caches)
          print(f"INVENTORY_ARTIFACT_COUNT={len(arts)}")
          print(f"INVENTORY_ARTIFACT_BYTES={art_bytes}")
          print(f"INVENTORY_CACHE_COUNT={len(caches)}")
          print(f"INVENTORY_CACHE_BYTES={cache_bytes}")
          print(f"INVENTORY_TOTAL_BYTES={art_bytes+cache_bytes}")
          print("OLDEST_ARTIFACTS_BEGIN")
          for r in arts[:30]:
              print("ARTIFACT|"+"|".join(r))
          print("OLDEST_ARTIFACTS_END")
          print("OLDEST_CACHES_BEGIN")
          for r in caches[:30]:
              print("CACHE|"+"|".join(r))
          print("OLDEST_CACHES_END")
          PY
