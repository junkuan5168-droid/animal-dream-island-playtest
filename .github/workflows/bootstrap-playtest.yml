name: Bootstrap latest Animal Dream Island playtest

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-playtest.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified Godot Web payload
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o BUILD_SHA.txt 'https://raw.githubusercontent.com/junkuan5168-droid/-cat-game-city/main/playtest/BUILD_SHA.txt?token=CE5ZHCAHVK3F3H2INFT4GJTKU4EL7AA'
          curl -fL --retry 3 -o game-a9927da.audio.position.worklet.js 'https://raw.githubusercontent.com/junkuan5168-droid/-cat-game-city/main/playtest/game-a9927da.audio.position.worklet.js?token=CE5ZHCFX47NADPIZ7S25DQTKU4EL7AA'
          curl -fL --retry 3 -o game-a9927da.audio.worklet.js 'https://raw.githubusercontent.com/junkuan5168-droid/-cat-game-city/main/playtest/game-a9927da.audio.worklet.js?token=CE5ZHCD6DNSHYQBYPEAT5W3KU4EL7AA'
          curl -fL --retry 3 -o game-a9927da.js 'https://raw.githubusercontent.com/junkuan5168-droid/-cat-game-city/main/playtest/game-a9927da.js?token=CE5ZHCFUKGA5MEX6HZURLYDKU4EL7AA'
          curl -fL --retry 3 -o game-a9927da.pck 'https://raw.githubusercontent.com/junkuan5168-droid/-cat-game-city/main/playtest/game-a9927da.pck?token=CE5ZHCABG3EOAT3GWGJ32SLKU4EL7AA'
          curl -fL --retry 3 -o game-a9927da.wasm 'https://raw.githubusercontent.com/junkuan5168-droid/-cat-game-city/main/playtest/game-a9927da.wasm?token=CE5ZHCHXERQGJH3R77HKY2LKU4EL7AA'
          curl -fL --retry 3 -o index.apple-touch-icon.png 'https://raw.githubusercontent.com/junkuan5168-droid/-cat-game-city/main/playtest/index.apple-touch-icon.png?token=CE5ZHCBALLFAVQZ6H45Y4ADKU4EL7AA'
          curl -fL --retry 3 -o index.html 'https://raw.githubusercontent.com/junkuan5168-droid/-cat-game-city/main/playtest/index.html?token=CE5ZHCCPW7TCJVPZALROW2LKU4EL7AA'
          curl -fL --retry 3 -o index.icon.png 'https://raw.githubusercontent.com/junkuan5168-droid/-cat-game-city/main/playtest/index.icon.png?token=CE5ZHCBW3F72PLS6ZXVQCGTKU4EL7AA'
          curl -fL --retry 3 -o index.png 'https://raw.githubusercontent.com/junkuan5168-droid/-cat-game-city/main/playtest/index.png?token=CE5ZHCDE2BBIXEE3YEWK26DKU4EL7AA'
          test "$(tr -d '\r\n' < BUILD_SHA.txt)" = 'a9927da3d7dafc8877ea9fd49040b16eb7a9e1b9'
          test "$(stat -c%s game-a9927da.pck)" = '8959732'
          test "$(stat -c%s game-a9927da.wasm)" = '39514754'

      - name: Commit imported playtest payload
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BUILD_SHA.txt game-a9927da.* index.html index.apple-touch-icon.png index.icon.png index.png
          if git diff --cached --quiet; then
            echo 'Payload already current.'
            exit 0
          fi
          git commit -m 'deploy: import verified Godot Web a9927da'
          git push origin main
