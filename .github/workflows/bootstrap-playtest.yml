name: Bootstrap rollback Animal Dream Island playtest

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-playtest.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified rollback Godot Web payload
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o BUILD_SHA.txt 'https://raw.githubusercontent.com/junkuan5168-droid/-cat-game-city/7eb6f4883c5c3d784c214c414c54fdc63621fb58/playtest/BUILD_SHA.txt?token=CE5ZHCA7D747EA6WNO556GTKU4JGZAA'
          curl -fL --retry 3 -o game-f351963.audio.position.worklet.js 'https://raw.githubusercontent.com/junkuan5168-droid/-cat-game-city/7eb6f4883c5c3d784c214c414c54fdc63621fb58/playtest/game-f351963.audio.position.worklet.js?token=CE5ZHCFNYAUNAN4PSE6W43TKU4JGZAA'
          curl -fL --retry 3 -o game-f351963.audio.worklet.js 'https://raw.githubusercontent.com/junkuan5168-droid/-cat-game-city/7eb6f4883c5c3d784c214c414c54fdc63621fb58/playtest/game-f351963.audio.worklet.js?token=CE5ZHCBYOBLJLOV6TU5MBJDKU4JGZAA'
          curl -fL --retry 3 -o game-f351963.js 'https://raw.githubusercontent.com/junkuan5168-droid/-cat-game-city/7eb6f4883c5c3d784c214c414c54fdc63621fb58/playtest/game-f351963.js?token=CE5ZHCDTBEZB7TRY562CRLTKU4JGZAA'
          curl -fL --retry 3 -o game-f351963.pck 'https://raw.githubusercontent.com/junkuan5168-droid/-cat-game-city/7eb6f4883c5c3d784c214c414c54fdc63621fb58/playtest/game-f351963.pck?token=CE5ZHCCQEVD3JKBQWNO4WMTKU4JGZAA'
          curl -fL --retry 3 -o game-f351963.wasm 'https://raw.githubusercontent.com/junkuan5168-droid/-cat-game-city/7eb6f4883c5c3d784c214c414c54fdc63621fb58/playtest/game-f351963.wasm?token=CE5ZHCEORXJBQORQSPASR2LKU4JGZAA'
          curl -fL --retry 3 -o index.html 'https://raw.githubusercontent.com/junkuan5168-droid/-cat-game-city/7eb6f4883c5c3d784c214c414c54fdc63621fb58/playtest/index.html?token=CE5ZHCBV2RWTC4K7GRQRIBLKU4JGZAA'
          test "$(tr -d '\r\n' < BUILD_SHA.txt)" = 'f35196392902d62dd2733a5b2b6e9ae6dfbeab3d'
          test "$(stat -c%s game-f351963.pck)" = '8957716'
          test "$(stat -c%s game-f351963.wasm)" = '39514754'

      - name: Commit imported rollback playtest payload
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BUILD_SHA.txt game-f351963.* index.html
          if git diff --cached --quiet; then
            echo 'Payload already current.'
            exit 0
          fi
          git commit -m 'deploy: import rollback Godot Web f351963'
          git push origin main

# retry with refreshed signed URLs
