name: Bootstrap rollback Animal Dream Island playtest

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-playtest.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified rollback Godot Web payload from immutable Vercel deployment
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://cat-game-city-leg590yn1-junkuan5168-7329.vercel.app'
          SHARE='ZSIFxzfLNr96HQqugbVGSpAK75qtjVEH'
          COOKIE='/tmp/vercel.cookies'

          curl -fsSL -c "$COOKIE" -b "$COOKIE" "$BASE/?_vercel_share=$SHARE" -o /dev/null
          curl -fL --retry 3 -c "$COOKIE" -b "$COOKIE" -o BUILD_SHA.txt "$BASE/playtest/BUILD_SHA.txt"
          curl -fL --retry 3 -c "$COOKIE" -b "$COOKIE" -o game-f351963.audio.position.worklet.js "$BASE/playtest/game-f351963.audio.position.worklet.js"
          curl -fL --retry 3 -c "$COOKIE" -b "$COOKIE" -o game-f351963.audio.worklet.js "$BASE/playtest/game-f351963.audio.worklet.js"
          curl -fL --retry 3 -c "$COOKIE" -b "$COOKIE" -o game-f351963.js "$BASE/playtest/game-f351963.js"
          curl -fL --retry 3 -c "$COOKIE" -b "$COOKIE" -o game-f351963.pck "$BASE/playtest/game-f351963.pck"
          curl -fL --retry 3 -c "$COOKIE" -b "$COOKIE" -o game-f351963.wasm "$BASE/playtest/game-f351963.wasm"
          curl -fL --retry 3 -c "$COOKIE" -b "$COOKIE" -o index.html "$BASE/playtest/index.html"

          test "$(tr -d '\r\n' < BUILD_SHA.txt)" = 'f35196392902d62dd2733a5b2b6e9ae6dfbeab3d'
          test "$(stat -c%s game-f351963.pck)" = '8957716'
          test "$(stat -c%s game-f351963.wasm)" = '39514754'

      - name: Commit imported rollback playtest payload
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BUILD_SHA.txt game-f351963.* index.html
          if git diff --cached --quiet; then
            echo 'Payload already current.'
            exit 0
          fi
          git commit -m 'deploy: import rollback Godot Web f351963'
          git push origin main
