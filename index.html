<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
<title>動物夢幻島</title>
<style>
html,body,#canvas{margin:0;padding:0;border:0;width:100%;height:100%}
body{color:white;background:#000;overflow:hidden;touch-action:none}
#canvas{display:block;width:100%;height:100%}#canvas:focus{outline:none}
#status,#status-splash,#status-progress,#status-detail{position:absolute;left:0;right:0}
#status,#status-splash{top:0;bottom:0}
#status{background:#242424;display:flex;flex-direction:column;justify-content:center;align-items:center;visibility:hidden}
#status-splash{max-height:100%;max-width:100%;margin:auto}
#status-splash.fullsize--true{height:100%;width:100%;object-fit:contain}
#status-progress{bottom:10%;width:72%;margin:0 auto;z-index:2}
#status-detail{bottom:5.5%;z-index:3;text-align:center;font:600 13px -apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;color:#17344a;text-shadow:0 1px 1px rgba(255,255,255,.65)}
#status-notice{display:none;position:absolute;left:5%;right:5%;bottom:6%;background:#5b3943;border-radius:.5rem;border:1px solid #9b3943;color:#fff;font:15px/1.4 -apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;padding:1rem;text-align:center;z-index:5;white-space:pre-wrap}
</style>
<link rel="icon" type="image/png" href="index.icon.png">
<link rel="apple-touch-icon" href="index.apple-touch-icon.png">
</head>
<body>
<canvas id="canvas">Your browser does not support the canvas tag.</canvas>
<noscript>Your browser does not support JavaScript.</noscript>
<div id="status">
<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
<progress id="status-progress"></progress>
<div id="status-detail">PLAYTEST daf7974 · 準備啟動…</div>
<div id="status-notice"></div>
</div>
<script src="game-a9927da.js"></script>
<script>
const GODOT_CONFIG={"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"game-a9927da","experimentalVK":false,"fileSizes":{"game-a9927da.pck":8959732,"game-a9927da.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED=false;
const engine=new Engine(GODOT_CONFIG);
(function(){
 const overlay=document.getElementById('status'),progress=document.getElementById('status-progress'),notice=document.getElementById('status-notice'),detail=document.getElementById('status-detail');
 let initializing=true,lastProgress=Date.now(),lastBytes=0;
 function show(){overlay.style.visibility='visible';progress.style.display='block';detail.style.display='block'}
 function fail(err){console.error(err);initializing=false;progress.style.display='none';detail.style.display='none';notice.style.display='block';notice.textContent='Godot 啟動失敗\n'+(err&&err.message?err.message:String(err||'未知錯誤'))+'\nBuild a9927da';}
 window.addEventListener('error',e=>{if(initializing)fail(e.error||e.message)});
 window.addEventListener('unhandledrejection',e=>{if(initializing)fail(e.reason)});
 show();
 detail.textContent='PLAYTEST daf7974 · 檢查 Safari / WebGL…';
 const missing=Engine.getMissingFeatures({threads:GODOT_THREADS_ENABLED});
 if(missing.length){fail('缺少瀏覽器功能：'+missing.join(', '));return;}
 detail.textContent='PLAYTEST daf7974 · 正在載入 Godot… 0%';
 const watchdog=setInterval(()=>{
   if(!initializing){clearInterval(watchdog);return;}
   const stalled=Math.floor((Date.now()-lastProgress)/1000);
   if(stalled>=20) detail.textContent='PLAYTEST daf7974 · 載入停滯 '+stalled+' 秒 · '+(lastBytes?'已收到資料':'尚未收到資料');
 },1000);
 engine.startGame({onProgress:(current,total)=>{
   lastProgress=Date.now(); lastBytes=current||lastBytes;
   if(current>0&&total>0){progress.value=current;progress.max=total;detail.textContent='PLAYTEST daf7974 · 正在載入 Godot… '+Math.min(100,Math.round(current/total*100))+'%';}
   else{progress.removeAttribute('value');progress.removeAttribute('max');detail.textContent='PLAYTEST daf7974 · 正在初始化 WebAssembly…';}
 }}).then(()=>{initializing=false;clearInterval(watchdog);overlay.remove();},fail);
}());
</script>
</body>
</html>
